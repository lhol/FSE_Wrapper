name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # nightly

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native
        run: |
          cd native
          mkdir -p build && cd build
          cmake ..
          cmake --build . --config Release

      - name: Run native bench
        run: |
          cd native/build
          ./bench_codecs > native_bench.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Java JMH
        run: |
          cd java
          mvn -DskipTests package
          java -jar target/*-shaded.jar -rf json -rff jmh_results.json -wi 3 -i 5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET benchmarks
        run: |
          cd Huff0.Net/Benchmarks
          dotnet run -c Release -- --exporters json --artifacts "artifacts"

      - name: Upload benchmark artifacts
        run: |
          python3 scripts/generate_dashboard.py

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            native/build/native_bench.txt
            java/jmh_results.json
            Huff0.Net/Benchmarks/artifacts

      - name: Generate dashboard
        run: |
          python3 scripts/generate_dashboard.py

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: performance-dashboard
          path: performance_dashboard.md

