name: Benchmarks

on:
  push:
    tags: ['v[0-9]+.[0-9]+.0']  # minor releases only (e.g. v1.1.0, v1.2.0)
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native
        run: |
          cmake -B native/build -S native
          cmake --build native/build --config Release

      - name: Run native bench
        run: |
          cd native/build
          ./bench_codecs > ../../native_bench.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Java JMH
        run: |
          ./mvnw -B -DskipTests package
          java -jar target/FSE_Wrapper-1.0.0.jar -rf json -rff jmh_results.json -wi 3 -i 5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Huff0.Net benchmarks
        run: |
          dotnet run -c Release --project csharp/Huff0.net/Benchmarks/Benchmarks.csproj \
            -- --exporters json --artifacts csharp/Huff0.net/Benchmarks/artifacts

      - name: Run Fse.Net benchmarks
        run: |
          dotnet run -c Release --project csharp/Fse.net/Benchmarks/Benchmarks.csproj \
            -- --exporters json --artifacts csharp/Fse.net/Benchmarks/artifacts

      - name: Generate dashboard
        run: python3 scripts/generate_dashboard.py

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            native_bench.txt
            jmh_results.json
            csharp/Huff0.net/Benchmarks/artifacts
            csharp/Fse.net/Benchmarks/artifacts

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: performance-dashboard
          path: performance_dashboard.md

