name: Build & Test

on:
  push:
    tags: ['v[0-9]+.[0-9]+.0']  # minor releases only (e.g. v1.1.0, v1.2.0)
  workflow_dispatch:

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set JAVA_HOME (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "PATH=$env:JAVA_HOME/bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Build & Test
        run: |
          cmake -B native/build -S native
          cmake --build native/build --config Release
          cd native/build && ctest --output-on-failure -C Release
      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: native/build

  java:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Linux native libs
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/build
      - name: Build & Test
        run: ./mvnw -B clean test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: |
          dotnet build csharp/Huff0.net/src/Huff0.Net.csproj -c Release
          dotnet build csharp/Fse.net/src/Fse.Net.csproj -c Release
