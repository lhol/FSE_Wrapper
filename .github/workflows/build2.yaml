name: Build & Test

on:
  #push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Install JDK (fixes JNI issues)
      # -----------------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set JAVA_HOME (Windows fix)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "PATH=$env:JAVA_HOME/bin;$env:PATH" >> $env:GITHUB_ENV

      # -----------------------------
      # Build native (CMake)
      # -----------------------------
      - name: Configure CMake
        run: |
          cd native
          mkdir build
          cd build
          cmake ..

      - name: Build native
        run: |
          cd native/build
          cmake --build . --config Release

      - name: Run native tests
        run: |
          cd native/build
          ctest --output-on-failure

      # -----------------------------
      # Java build + tests
      # -----------------------------
      - name: Build Java
        run: |
          cd java
          mvn -B clean test

      # -----------------------------
      # .NET build + tests
      # -----------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET
        run: |
          cd Huff0.Net
          dotnet test -c Release
