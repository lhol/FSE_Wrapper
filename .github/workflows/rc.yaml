name: Release Candidate

on:
  push:
    tags:
      - 'RC-v*.*.*'
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Build native shared libraries on every target platform
  # ─────────────────────────────────────────────────────────────────────────────
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            rid: linux-x64
            cmake_arch: ''
          - os: ubuntu-latest
            artifact: linux-arm64
            rid: linux-arm64
            cmake_arch: '-DCMAKE_SYSTEM_PROCESSOR=aarch64'
          - os: macos-latest
            artifact: macos-arm64
            rid: osx-arm64
            cmake_arch: ''
          - os: windows-latest
            artifact: win-x64
            rid: win-x64
            cmake_arch: ''
          - os: windows-latest
            artifact: win-arm64
            rid: win-arm64
            cmake_arch: '-A ARM64'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - name: Set JAVA_HOME (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "PATH=$env:JAVA_HOME/bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Install cross-compiler (Linux ARM64)
        if: matrix.artifact == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build and test native
        shell: bash
        run: |
          cmake -B native/build -S native ${{ matrix.cmake_arch }}
          cmake --build native/build --config Release
          cd native/build && ctest --output-on-failure -C Release || true
      - name: Collect native libs and bench binary
        shell: bash
        run: |
          mkdir -p dist
          find native/build -maxdepth 2 \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) \
            -exec cp {} dist/ \;
          if [ -f "native/build/bench_codecs" ]; then
            cp native/build/bench_codecs dist/
          fi
          if [ -f "native/build/bench_codecs.exe" ]; then
            cp native/build/bench_codecs.exe dist/
          fi
          if [ -f "native/build/Release/bench_codecs.exe" ]; then
            cp native/build/Release/bench_codecs.exe dist/
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and test Java (JNI) — produces the shaded JMH/runtime JAR
  # ─────────────────────────────────────────────────────────────────────────────
  java-jni:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Download linux-x64 native libs
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
      - name: Test JNI
        run: ./mvnw -B clean test
      - name: Download all native libs into per-RID directories (for multi-platform JAR)
        run: mkdir -p native/artifacts/{linux-x64,linux-arm64,osx-arm64,win-x64,win-arm64}
      - uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/artifacts/linux-x64
      - uses: actions/download-artifact@v5
        with:
          name: native-linux-arm64-${{ github.ref_name }}
          path: native/artifacts/linux-arm64
      - uses: actions/download-artifact@v5
        with:
          name: native-macos-arm64-${{ github.ref_name }}
          path: native/artifacts/osx-arm64
      - uses: actions/download-artifact@v5
        with:
          name: native-win-x64-${{ github.ref_name }}
          path: native/artifacts/win-x64
      - uses: actions/download-artifact@v5
        with:
          name: native-win-arm64-${{ github.ref_name }}
          path: native/artifacts/win-arm64
      - name: Package library JAR
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^RC-v//')
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          ./mvnw -B package -DskipTests
      - name: Find library JAR
        id: jar
        run: echo "path=$(ls target/FSE_Wrapper-*.jar | grep -v '\-javadoc' | grep -v '\-sources' | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v5
        with:
          name: java-jni-jar-${{ github.ref_name }}
          path: ${{ steps.jar.outputs.path }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and test Java Panama FFI (Java 22+) — produces a separate JAR
  # ─────────────────────────────────────────────────────────────────────────────
  java-panama:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Download linux-x64 native libs
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
      - name: Test Panama FFI
        run: ./mvnw -f java-panama/pom.xml -B clean test
      - name: Package Panama JAR
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^RC-v//')
          ./mvnw -f java-panama/pom.xml versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          ./mvnw -f java-panama/pom.xml -B package -DskipTests
      - name: Find Panama JAR
        id: jar
        run: echo "path=$(ls java-panama/target/FSE_Wrapper-panama-*.jar | grep -v '\-javadoc' | grep -v '\-sources' | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v5
        with:
          name: java-panama-jar-${{ github.ref_name }}
          path: ${{ steps.jar.outputs.path }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Build .NET libs and create NuGet packages
  # ─────────────────────────────────────────────────────────────────────────────
  dotnet:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Download all native artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: native-*-${{ github.ref_name }}
          path: native-artifacts
      - name: Populate NuGet runtimes directories
        run: |
          for pkg in Huff0.net Fse.net; do
            mkdir -p csharp/${pkg}/runtimes/linux-x64/native
            mkdir -p csharp/${pkg}/runtimes/linux-arm64/native
            mkdir -p csharp/${pkg}/runtimes/osx-arm64/native
            mkdir -p csharp/${pkg}/runtimes/win-x64/native
            mkdir -p csharp/${pkg}/runtimes/win-arm64/native
          done
          cp native-artifacts/native-linux-x64-${{ github.ref_name }}/libhuff0.so   csharp/Huff0.net/runtimes/linux-x64/native/
          cp native-artifacts/native-linux-arm64-${{ github.ref_name }}/libhuff0.so csharp/Huff0.net/runtimes/linux-arm64/native/
          cp native-artifacts/native-macos-arm64-${{ github.ref_name }}/libhuff0.dylib csharp/Huff0.net/runtimes/osx-arm64/native/
          cp native-artifacts/native-win-x64-${{ github.ref_name }}/huff0.dll   csharp/Huff0.net/runtimes/win-x64/native/
          cp native-artifacts/native-win-arm64-${{ github.ref_name }}/huff0.dll csharp/Huff0.net/runtimes/win-arm64/native/
          cp native-artifacts/native-linux-x64-${{ github.ref_name }}/libfse.so   csharp/Fse.net/runtimes/linux-x64/native/
          cp native-artifacts/native-linux-arm64-${{ github.ref_name }}/libfse.so csharp/Fse.net/runtimes/linux-arm64/native/
          cp native-artifacts/native-macos-arm64-${{ github.ref_name }}/libfse.dylib csharp/Fse.net/runtimes/osx-arm64/native/
          cp native-artifacts/native-win-x64-${{ github.ref_name }}/fse.dll   csharp/Fse.net/runtimes/win-x64/native/
          cp native-artifacts/native-win-arm64-${{ github.ref_name }}/fse.dll csharp/Fse.net/runtimes/win-arm64/native/
      - name: Build and pack NuGet packages
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^RC-v//')
          dotnet build csharp/Huff0.net/src/Huff0.Net.csproj -c Release -p:Version=${VERSION}
          dotnet build csharp/Fse.net/src/Fse.Net.csproj    -c Release -p:Version=${VERSION}
          dotnet pack  csharp/Huff0.net/src/Huff0.Net.csproj -c Release -p:Version=${VERSION} --no-build -o nuget-out/
          dotnet pack  csharp/Fse.net/src/Fse.Net.csproj    -c Release -p:Version=${VERSION} --no-build -o nuget-out/
      - uses: actions/upload-artifact@v5
        with:
          name: dotnet-libs-${{ github.ref_name }}
          path: |
            csharp/Huff0.net/src/bin/Release/
            csharp/Fse.net/src/bin/Release/
      - uses: actions/upload-artifact@v5
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: nuget-out/*.nupkg

  # ─────────────────────────────────────────────────────────────────────────────
  # Bundle per-platform ZIPs for manual inspection
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    needs: [native, java-jni, java-panama, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-${{ github.ref_name }}'
          path: artifacts
      - name: Create release ZIPs
        run: |
          TAG=${{ github.ref_name }}
          for plat in linux-x64 linux-arm64 macos-arm64 win-x64 win-arm64; do
            zip -j FSE_Wrapper-${TAG}-native-${plat}.zip artifacts/native-${plat}-${TAG}/*
          done
          zip -j FSE_Wrapper-${TAG}-java-jni.zip    artifacts/java-jni-jar-${TAG}/*
          zip -j FSE_Wrapper-${TAG}-java-panama.zip artifacts/java-panama-jar-${TAG}/*
          zip -r FSE_Wrapper-${TAG}-dotnet.zip      artifacts/dotnet-libs-${TAG}/
          zip -j FSE_Wrapper-${TAG}-nuget.zip       artifacts/nuget-packages-${TAG}/*
      - uses: actions/upload-artifact@v5
        with:
          name: release-packages-${{ github.ref_name }}
          path: FSE_Wrapper-*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # Benchmark validation (non-blocking)
  # ─────────────────────────────────────────────────────────────────────────────
  bench:
    needs: native
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Download linux-x64 native libs
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
      - name: Native benchmark
        shell: bash
        run: |
          chmod +x native/build/bench_codecs
          cd native/build && ./bench_codecs > ../../native_bench.txt
          cat ../../native_bench.txt
      - name: Java JMH benchmark (short run)
        run: |
          ./mvnw -B package -DskipTests -P bench
          JAR=$(ls target/FSE_Wrapper-*-benchmarks.jar | head -1)
          java -jar "$JAR" -rf json -rff jmh_results.json -wi 1 -i 2
          java -jar "$JAR" -rf json -rff jmh_results.json -wi 1 -i 2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: .NET Huff0 benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/build
        run: |
          dotnet run -c Release --project csharp/Huff0.net/Benchmarks/Benchmarks.csproj \
            -- --job short --exporters json --artifacts csharp/Huff0.net/Benchmarks/artifacts
      - name: .NET Fse benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/build
        run: |
          dotnet run -c Release --project csharp/Fse.net/Benchmarks/Benchmarks.csproj \
            -- --job short --exporters json --artifacts csharp/Fse.net/Benchmarks/artifacts
      - name: Generate benchmark dashboard
        run: python3 scripts/generate_dashboard.py
      - uses: actions/upload-artifact@v5
        with:
          name: rc-benchmarks-${{ github.ref_name }}
          path: |
            native_bench.txt
            jmh_results.json
            performance_dashboard.md
            csharp/Huff0.net/Benchmarks/artifacts
            csharp/Fse.net/Benchmarks/artifacts
