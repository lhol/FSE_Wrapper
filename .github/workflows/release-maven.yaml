name: Publish to Maven Central

# Triggered by a vX.Y.Z release tag. Runs AFTER the main release workflow.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # setup-java writes ~/.m2/settings.xml with a <server id="central"> block
      # populated from the env vars below, and imports the GPG key.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Download linux-x64 native libs so javadoc can resolve JNI native methods
      - name: Download linux-x64 native libs
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
        continue-on-error: true   # safe to proceed if artifact not present

      - name: Set version from tag
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          ./mvnw -f java-panama/pom.xml versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Deploy JNI JAR to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B clean deploy -DskipTests \
            -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Deploy Panama JAR to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -f java-panama/pom.xml -B clean deploy -DskipTests \
            -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP (done by the repository owner — OSSRH is EOL since 2025-06-30)
# Use the new Central Publisher Portal at https://central.sonatype.com/
# ─────────────────────────────────────────────────────────────────────────────
#
# STEP 1 — Create / log in to the Central Publisher Portal
#   → https://central.sonatype.com/  (GitHub login supported)
#   → If you had an OSSRH account, use the same credentials — namespaces were migrated.
#
# STEP 2 — Claim the namespace io.github.lhol  (if not already done)
#   → Central Portal → My Namespaces → Add Namespace → io.github.lhol
#   → Verification is usually via a DNS TXT record or a GitHub repository link.
#
# STEP 3 — Generate a User Token
#   → Central Portal → Account (top-right) → User Token
#      https://central.sonatype.com/usertoken
#   → Click "Generate User Token", give it a name and expiry
#   → Save the "Username" and "Password" shown — they cannot be retrieved again
#
# STEP 4 — Add GitHub repository secrets (Settings → Secrets → Actions):
#   CENTRAL_TOKEN_USERNAME  ← the token "Username" from Step 3
#   CENTRAL_TOKEN_PASSWORD  ← the token "Password" from Step 3
#   GPG_PRIVATE_KEY         ← armored private GPG key (see Step 5)
#   GPG_PASSPHRASE          ← passphrase for the GPG key
#
# STEP 5 — Generate a GPG key (if you don't have one)
#   gpg --full-gen-key           # choose RSA 4096, set a passphrase
#   gpg --list-secret-keys --keyid-format=long
#   gpg --armor --export-secret-keys <KEY_ID>   # paste into CENTRAL_GPG_PRIVATE_KEY secret
#   gpg --keyserver keyserver.ubuntu.com --send-keys <KEY_ID>  # publish public key
#
# STEP 6 — Create a GitHub Environment named "release"
#   → Settings → Environments → New environment → "release"
#   → Optionally add required reviewers for manual approval
#
# After these steps, every vX.Y.Z tag will:
#   1. Run the main release.yaml  (native builds, NuGet, GitHub Release)
#   2. Run this workflow           (Maven Central publishing)
