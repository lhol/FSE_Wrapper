name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases and upload assets
  id-token: write   # OIDC for potential future use
  packages: write   # publish to GitHub Packages (NuGet feed)

jobs:
  # ---------------------------------------------------------------------------
  # Build and test native libs on every target platform in parallel
  # ---------------------------------------------------------------------------
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            rid: linux-x64
            cmake_arch: ""
          - os: ubuntu-latest
            artifact: linux-arm64
            rid: linux-arm64
            cmake_arch: "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
          - os: macos-latest
            artifact: macos-arm64
            rid: osx-arm64       # macos-latest runners are Apple Silicon
            cmake_arch: ""
          - os: windows-latest
            artifact: win-x64
            rid: win-x64
            cmake_arch: ""
          - os: windows-latest
            artifact: win-arm64
            rid: win-arm64
            cmake_arch: "-A ARM64"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - name: Set JAVA_HOME (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "PATH=$env:JAVA_HOME/bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.artifact == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build & Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B native/build -S native ${{ matrix.cmake_arch }}
            cmake --build native/build --config Release
            cd native/build && ctest --output-on-failure -C Release || true
          else
            cmake -B native/build -S native ${{ matrix.cmake_arch }}
            cmake --build native/build --config Release
            cd native/build && ctest --output-on-failure -C Release || true
          fi
      - name: Collect native libs
        shell: bash
        run: |
          mkdir -p dist
          find native/build -maxdepth 2 \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) \
            -exec cp {} dist/ \;
          # Also collect benchmark binary if it exists
          if [ -f "native/build/bench_codecs" ]; then
            cp native/build/bench_codecs dist/
          fi
          if [ -f "native/build/Release/bench_codecs.exe" ]; then
            cp native/build/Release/bench_codecs.exe dist/
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Build + test Java JNI, package shaded JAR
  # ---------------------------------------------------------------------------
  java-jni:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Download linux-x64 native libs (for JNI tests)
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
      - name: Test JNI
        run: ./mvnw -B clean test
      - name: Download all native libs (for multi-platform JAR)
        uses: actions/download-artifact@v5
        with:
          pattern: native-*-${{ github.ref_name }}
          merge-multiple: true
          path: native/build
      - name: Package shaded JAR with release version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          ./mvnw -B package -DskipTests
      - name: Find shaded JAR
        id: jar
        run: echo "path=$(ls target/FSE_Wrapper-*.jar | grep -v original | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v5
        with:
          name: java-jni-jar-${{ github.ref_name }}
          path: ${{ steps.jar.outputs.path }}

  # ---------------------------------------------------------------------------
  # Build + test Java Panama FFI (Java 22+), package separate JAR
  # ---------------------------------------------------------------------------
  java-panama:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Download linux-x64 native libs
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x64-${{ github.ref_name }}
          path: native/build
      - name: Test Panama FFI
        run: ./mvnw -f java-panama/pom.xml -B clean test
      - name: Package Panama JAR
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          ./mvnw -f java-panama/pom.xml versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          ./mvnw -f java-panama/pom.xml -B package -DskipTests
      - name: Find Panama JAR
        id: jar
        run: echo "path=$(ls java-panama/target/FSE_Wrapper-panama-*.jar | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v5
        with:
          name: java-panama-jar-${{ github.ref_name }}
          path: ${{ steps.jar.outputs.path }}


  # ---------------------------------------------------------------------------
  # Build .NET libs and create NuGet packages with all platform native libs
  # ---------------------------------------------------------------------------
  dotnet:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.ref_name }}
          path: native-artifacts
      - name: Populate NuGet runtimes directories
        run: |
          for pkg in Huff0.net Fse.net; do
            mkdir -p csharp/${pkg}/runtimes/linux-x64/native
            mkdir -p csharp/${pkg}/runtimes/linux-arm64/native
            mkdir -p csharp/${pkg}/runtimes/osx-arm64/native
            mkdir -p csharp/${pkg}/runtimes/win-x64/native
            mkdir -p csharp/${pkg}/runtimes/win-arm64/native
          done
          # Huff0
          cp native-artifacts/native-linux-x64-${{ github.ref_name }}/libhuff0.so    csharp/Huff0.net/runtimes/linux-x64/native/
          cp native-artifacts/native-linux-arm64-${{ github.ref_name }}/libhuff0.so  csharp/Huff0.net/runtimes/linux-arm64/native/
          cp native-artifacts/native-macos-arm64-${{ github.ref_name }}/libhuff0.dylib  csharp/Huff0.net/runtimes/osx-arm64/native/
          cp native-artifacts/native-win-x64-${{ github.ref_name }}/huff0.dll    csharp/Huff0.net/runtimes/win-x64/native/
          cp native-artifacts/native-win-arm64-${{ github.ref_name }}/huff0.dll  csharp/Huff0.net/runtimes/win-arm64/native/
          # Fse
          cp native-artifacts/native-linux-x64-${{ github.ref_name }}/libfse.so      csharp/Fse.net/runtimes/linux-x64/native/
          cp native-artifacts/native-linux-arm64-${{ github.ref_name }}/libfse.so    csharp/Fse.net/runtimes/linux-arm64/native/
          cp native-artifacts/native-macos-arm64-${{ github.ref_name }}/libfse.dylib    csharp/Fse.net/runtimes/osx-arm64/native/
          cp native-artifacts/native-win-x64-${{ github.ref_name }}/fse.dll      csharp/Fse.net/runtimes/win-x64/native/
          cp native-artifacts/native-win-arm64-${{ github.ref_name }}/fse.dll    csharp/Fse.net/runtimes/win-arm64/native/
      - name: Build Huff0.Net
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          dotnet build csharp/Huff0.net/src/Huff0.Net.csproj -c Release -p:Version=${VERSION}
      - name: Build Fse.Net
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          dotnet build csharp/Fse.net/src/Fse.Net.csproj -c Release -p:Version=${VERSION}
      - name: Pack NuGet packages
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          dotnet pack csharp/Huff0.net/src/Huff0.Net.csproj -c Release -p:Version=${VERSION} --no-build -o nuget-out/
          dotnet pack csharp/Fse.net/src/Fse.Net.csproj    -c Release -p:Version=${VERSION} --no-build -o nuget-out/
      - uses: actions/upload-artifact@v5
        with:
          name: dotnet-libs-${{ github.ref_name }}
          path: |
            csharp/Huff0.net/src/bin/Release/
            csharp/Fse.net/src/bin/Release/
      - uses: actions/upload-artifact@v5
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: nuget-out/*.nupkg

  # ---------------------------------------------------------------------------
  # Bundle per-platform ZIPs (filenames include the version tag)
  # ---------------------------------------------------------------------------
  package:
    needs: [native, java-jni, java-panama, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: '*-${{ github.ref_name }}'
          path: artifacts
      - name: Create release ZIPs
        run: |
          TAG=${{ github.ref_name }}
          for plat in linux-x64 linux-arm64 macos-arm64 win-x64 win-arm64; do
            zip -j FSE_Wrapper-${TAG}-native-${plat}.zip artifacts/native-${plat}-${TAG}/*
          done
          zip -j FSE_Wrapper-${TAG}-java-jni.zip    artifacts/java-jni-jar-${TAG}/*
          zip -j FSE_Wrapper-${TAG}-java-panama.zip artifacts/java-panama-jar-${TAG}/*
          zip -r FSE_Wrapper-${TAG}-dotnet.zip      artifacts/dotnet-libs-${TAG}/
          zip -j FSE_Wrapper-${TAG}-nuget.zip       artifacts/nuget-packages-${TAG}/*
      - uses: actions/upload-artifact@v5
        with:
          name: release-packages-${{ github.ref_name }}
          path: FSE_Wrapper-*.zip

  # ---------------------------------------------------------------------------
  # Create the GitHub Release and attach all versioned ZIPs
  # ---------------------------------------------------------------------------
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-packages-${{ github.ref_name }}
          path: packages
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Check if release already exists
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG already exists, uploading artifacts..."
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              packages/*.zip
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Release $TAG" \
              --generate-notes \
              packages/*.zip
          fi

  # ---------------------------------------------------------------------------
  # Publish NuGet packages to nuget.org and GitHub Packages
  # ---------------------------------------------------------------------------
  nuget-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      packages: write  # required for GitHub Packages push
      id-token: write  # must be set at job level (overrides workflow default)
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: nuget-out
      - name: Authenticate with nuget.org (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: lhol
      - name: Push packages to nuget.org
        run: |
          dotnet nuget push nuget-out/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - name: Push packages to GitHub Packages
        run: |
          dotnet nuget push nuget-out/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

  # ---------------------------------------------------------------------------
  # Smoke test: verify NuGet packages install and work after publish
  # ---------------------------------------------------------------------------
  smoke-nuget:
    needs: nuget-publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Create and test minimal consumer project
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          mkdir -p /tmp/smoke-nuget && cd /tmp/smoke-nuget
          dotnet new console -n SmokeTest --force
          cd SmokeTest
          dotnet add package Huff0.Net --version ${VERSION}
          dotnet add package Fse.Net   --version ${VERSION}
          cat > Program.cs << 'EOF'
          using System;
          using System.Text;
          using Huff0.Net;
          using Fse.Net;

          var data = Encoding.UTF8.GetBytes("Hello from FSE_Wrapper smoke test!");
          var h0  = Huff0Interop.Compress(data);
          var h0d = Huff0Interop.Decompress(h0, data.Length);
          if (!data.AsSpan().SequenceEqual(h0d)) throw new Exception("Huff0 roundtrip failed");
          var fse  = FseInterop.Compress(data);
          var fsed = FseInterop.Decompress(fse, data.Length);
          if (!data.AsSpan().SequenceEqual(fsed)) throw new Exception("FSE roundtrip failed");
          Console.WriteLine("Smoke test passed: Huff0 and FSE roundtrip OK");
          EOF
          dotnet run

  # ---------------------------------------------------------------------------
  # Run benchmarks and attach results to the release (non-blocking)
  # ---------------------------------------------------------------------------
  bench:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Build native
        run: |
          cmake -B native/build -S native
          cmake --build native/build --config Release
      - name: Native benchmark
        run: |
          cd native/build && ./bench_codecs > ../../native_bench.txt
      - name: Java JMH benchmark
        run: |
          ./mvnw -B package -DskipTests
          JAR=$(ls target/FSE_Wrapper-*.jar | grep -v original | head -1)
          java -jar "$JAR" -rf json -rff jmh_results.json -wi 3 -i 5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: .NET Huff0 benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/build
        run: |
          dotnet run -c Release --project csharp/Huff0.net/Benchmarks/Benchmarks.csproj \
            -- --job short --exporters json --artifacts csharp/Huff0.net/Benchmarks/artifacts
      - name: .NET Fse benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/build
        run: |
          dotnet run -c Release --project csharp/Fse.net/Benchmarks/Benchmarks.csproj \
            -- --job short --exporters json --artifacts csharp/Fse.net/Benchmarks/artifacts
      - name: Generate dashboard
        run: python3 scripts/generate_dashboard.py
      - name: Upload benchmark results to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            native_bench.txt jmh_results.json performance_dashboard.md
